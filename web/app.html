<title>Tensile Test Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    --ground: #e8eaee;
    --stage: #dfe3e8;
    --surface: #ffffff;
    --surface-2: #f4f5f7;
    --ink: #14181b;
    --ink-2: #3c464e;
    --muted: #68727a;
    --line: #d0d5da;
    --line-2: #e2e6e9;
    --accent: #b8491a;
    --steel: #3d5a73;
    --warn: #8f5c10;
    --bad: #a32c2c;
    --good: #2c6a4c;
    --panel-bg: rgba(255, 255, 255, .93);
    --shadow: 0 1px 2px rgba(20, 30, 40, .08), 0 8px 26px rgba(20, 30, 40, .10);
    --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --f-body: "Barlow", system-ui, -apple-system, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --bar: 306px;
    --hud: 156px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0c0f11; --stage: #12161a; --surface: #161a1e; --surface-2: #1d2226;
      --ink: #e7ebee; --ink-2: #b9c2c9; --muted: #8a949c;
      --line: #2a3238; --line-2: #222a30;
      --accent: #ff8c42; --steel: #8bb0d2; --warn: #d9a33f;
      --bad: #e4736b; --good: #63b98c;
      --panel-bg: rgba(20, 24, 28, .93);
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.42);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0c0f11; --stage: #12161a; --surface: #161a1e; --surface-2: #1d2226;
    --ink: #e7ebee; --ink-2: #b9c2c9; --muted: #8a949c;
    --line: #2a3238; --line-2: #222a30;
    --accent: #ff8c42; --steel: #8bb0d2; --warn: #d9a33f;
    --bad: #e4736b; --good: #63b98c;
    --panel-bg: rgba(20, 24, 28, .93);
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.42);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0; }
  .lab { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }

  /* ================= desktop: the simulation IS the page ================= */
  /* The canvas fills everything right of the sidebar and ABOVE the readout bar.
     The specimen is the page; nothing is drawn on top of it. */
  /* The canvas is a REPLACED element: width/height:auto resolve to its intrinsic
     300x150, not to the inset box, so positioning it directly left it at 300x150
     however many insets were set. The wrapper owns the geometry; the canvas just
     fills it. */
  .stagewrap {
    position: fixed; top: 0; right: 0; bottom: var(--hud); left: var(--bar);
    z-index: 0; background: var(--stage);
  }
  #viewport {
    display: block; width: 100%; height: 100%; background: var(--stage);
    touch-action: none; cursor: grab;
  }
  #viewport:active { cursor: grabbing; }
  #viewport:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }

  .side {
    position: fixed; top: 0; left: 0; bottom: 0; width: var(--bar); z-index: 3;
    background: var(--surface); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px calc(env(safe-area-inset-bottom, 0px) + 12px);
    gap: 9px;
  }
  .side h1 { font-family: var(--f-display); font-size: 21px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; margin: 0; line-height: 1; }
  .grow { flex: 1 1 auto; min-height: 0; }

  /* A solid bar BELOW the stage, not a card floating over it. The specimen is
     the point of the page; covering it with the numbers defeats the layout. */
  .hud {
    position: fixed; left: var(--bar); right: 0; bottom: 0; height: var(--hud); z-index: 2;
    background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .card { background: var(--surface); }

  .phase { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
  .hint { color: var(--muted); white-space: nowrap; }

  .hud-inner { display: flex; height: 100%; align-items: stretch; }
  .curve-card { flex: 0 0 302px; min-width: 0; padding: 5px 8px 3px; border-right: 1px solid var(--line-2); }
  #curve { display: block; width: 100%; height: 100%; }
  .out-card { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .verdictrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 6px 13px; border-bottom: 1px solid var(--line-2); }
  .verdict { font-family: var(--f-display); font-size: 16px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .verdict.held { color: var(--good); } .verdict.yielded { color: var(--warn); } .verdict.broke { color: var(--bad); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 1px; background: var(--line-2); flex: 1 1 auto; }
  .tile { background: var(--surface); padding: 5px 12px; min-width: 0; transition: background .45s ease; display: flex; flex-direction: column; justify-content: center; }
  .tile .v { font-family: var(--f-mono); font-size: clamp(15px, 1.4vw, 20px); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.18; margin-top: 1px; white-space: nowrap; }
  .tile .v u { text-decoration: none; font-size: .5em; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .tile.key .v { color: var(--accent); }
  .out.pending .tile .v, .out.pending .verdict { color: var(--muted); opacity: .4; }
  .out.flash .tile { background: var(--surface-2); }
  .live { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line-2); border-top: 1px solid var(--line-2); }
  .live div { background: var(--surface); padding: 4px 12px; min-width: 0; display: flex; align-items: baseline; gap: 6px; }
  .live .v { font-family: var(--f-mono); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .live .v u { text-decoration: none; font-size: .64em; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .strengths { padding: 4px 12px; border-top: 1px solid var(--line-2); font-family: var(--f-mono); font-size: 10px; color: var(--muted); display: flex; gap: 3px 14px; background: var(--surface); overflow: hidden; white-space: nowrap; }
  .strengths b { color: var(--ink-2); font-weight: 500; }

  /* ---- sidebar controls ---- */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .mode { font-family: var(--f-display); font-size: 13.5px; font-weight: 600; padding: 6px 4px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); border-radius: 3px; cursor: pointer; }
  .mode[aria-pressed="true"] { background: var(--steel); border-color: var(--steel); color: #fff; }

  .block > .lab { display: block; margin-bottom: 4px; }
  .sub { font-family: var(--f-body); font-size: 11px; color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 6px; }
  .presets { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-family: var(--f-display); font-size: 13px; font-weight: 600; padding: 3px 8px; border: 1px dashed var(--line); background: var(--surface-2); color: var(--ink-2); border-radius: 3px; cursor: pointer; }
  .chip:hover { border-color: var(--steel); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); border-style: solid; color: #fff; }

  .els { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
  .f { min-width: 0; }
  .f > label { display: flex; justify-content: space-between; align-items: baseline; gap: 3px; font-family: var(--f-mono); font-size: 9.5px; color: var(--muted); }
  .f > label .rng { font-size: 8px; opacity: .85; letter-spacing: -.02em; }
  .f input { width: 100%; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; padding: 4px 6px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface-2); color: var(--ink); }
  .f input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .f.flag input { border-color: var(--warn); }
  .f.bad input { border-color: var(--bad); }

  .withunit { display: grid; grid-template-columns: 1fr auto; gap: 4px; }
  select { font-family: var(--f-mono); font-size: 12px; padding: 4px 3px; border: 1px solid var(--line); border-radius: 3px; background: var(--surface-2); color: var(--ink-2); cursor: pointer; }
  select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .geo { display: grid; gap: 6px; }

  .run { width: 100%; padding: 9px; cursor: pointer; font-family: var(--f-display); font-size: 16px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; background: var(--accent); color: #fff; border: none; border-radius: 3px; }
  .run:hover { filter: brightness(1.08); }
  .run:disabled { opacity: .5; cursor: progress; }
  .run:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Only this can ever scroll, and only when a run of flags is unusually long. */
  .guard { display: grid; gap: 4px; overflow-y: auto; max-height: 150px; }
  .guard:empty { display: none; }
  .flagline { font-size: 11.5px; line-height: 1.28; color: var(--ink-2); border-left: 3px solid var(--warn); padding: 3px 0 3px 7px; background: var(--surface-2); overflow-wrap: anywhere; min-width: 0; }
  .flagline.bad { border-left-color: var(--bad); }
  .flagline b { font-family: var(--f-mono); color: var(--warn); }
  .flagline.bad b { color: var(--bad); }
  .foot { font-size: 11px; color: var(--muted); }
  .foot a { color: var(--steel); }

  /* ================= narrow: back to normal flow ================= */
  @media (max-width: 899px) {
    html, body { height: auto; }
    .stagewrap { position: static; background: none; padding: 0 12px; }
    #viewport { height: 44vh; min-height: 250px; border-radius: 5px; }
    .side { position: static; width: auto; border-right: none; border-bottom: 1px solid var(--line); }
    .hud { position: static; left: auto; right: auto; height: auto; border-top: none; margin: 10px 12px 18px; }
    .hud-inner { flex-wrap: wrap; height: auto; }
    .curve-card { flex: 1 1 100%; border-right: none; border-bottom: 1px solid var(--line-2); }
    #curve { height: 140px; }
    .out-card { flex: 1 1 100%; border: 1px solid var(--line); border-radius: 5px; }
    .stagewrap { padding: 0 12px; }
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<aside class="side">
  <h1>Tensile Test Bench</h1>

  <div class="modes">
    <button type="button" class="mode" id="mode-pull" aria-pressed="true">Pull to failure</button>
    <button type="button" class="mode" id="mode-load" aria-pressed="false">Apply a load</button>
  </div>

  <div class="block">
    <span class="lab">Presets <span class="sub">example chemistries &mdash; edit freely</span></span>
    <div class="presets" id="presets"></div>
  </div>

  <div class="block">
    <span class="lab">Composition &mdash; wt % <span class="sub">range the model has seen</span></span>
    <div class="els" id="els"></div>
  </div>

  <div class="block geo">
    <span class="lab">Specimen</span>
    <div class="f">
      <label for="area">Cross-section</label>
      <div class="withunit">
        <input id="area" type="number" min="0" step="1" value="78.5">
        <select id="u-area" aria-label="Cross-section unit"></select>
      </div>
    </div>
    <div class="f">
      <label for="gauge">Length</label>
      <div class="withunit">
        <input id="gauge" type="number" min="0" step="5" value="50">
        <select id="u-len" aria-label="Length unit"></select>
      </div>
    </div>
    <div class="f" id="load-row" hidden>
      <label for="target">Load to apply</label>
      <div class="withunit">
        <input id="target" type="number" min="0" step="1" value="45">
        <select id="u-force" aria-label="Load unit"></select>
      </div>
    </div>
  </div>

  <button class="run" id="run" type="button">Pull to failure</button>
  <div class="guard" id="guard"></div>
  <div class="grow"></div>
  <div class="foot">Chemistry-only, 1,359 heats &middot;
    <a href="https://github.com/DavidDruker/stress-strain-predictor">model &amp; limits</a></div>
</aside>

<div class="stagewrap">
  <canvas id="viewport" tabindex="0" role="img"
          aria-label="3D view of the test specimen being pulled"></canvas>
</div>

<div class="hud">
  <div class="hud-inner">
    <div class="card curve-card">
      <canvas id="curve" role="img" aria-label="Load-extension curve from zero load to fracture"></canvas>
    </div>
    <div class="card out-card out" id="results">
      <div class="verdictrow">
        <span class="verdict" id="verdict" aria-live="polite">&mdash;</span>
        <span class="phase" id="phase">At rest</span>
      </div>
      <div class="tiles" id="tiles" aria-live="polite"></div>
      <div class="live">
        <div><div class="lab">Load</div><div class="v" id="live-force">0.0<u>kN</u></div></div>
        <div><div class="lab">Extension</div><div class="v" id="live-ext">0.00<u>mm</u></div></div>
        <div><div class="lab">Length</div><div class="v" id="live-len">50.00<u>mm</u></div></div>
      </div>
      <div class="strengths">
        <span>Yield <b id="s-ys">&mdash;</b></span>
        <span>Tensile <b id="s-uts">&mdash;</b></span>
        <span>Elongation <b id="s-el">&mdash;</b></span>
        <span>Neck <b id="s-ra">&mdash;</b></span>
        <span class="hint lab" style="margin-left:auto">Drag or arrows to rotate &middot; scroll to zoom</span>
      </div>
    </div>
  </div>
</div>

<script src="model.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  var MODEL = window.SP_MODEL;
  var E_MODULUS = 205000;            // MPa; ~constant for steel, so never modelled

  /* ================= units =================
     Everything inside is mm, mm^2 and kN. Units are a presentation layer on the
     way in and out, so no conversion factor can ever reach the model. */
  var UNITS = {
    area:  { "mm2": 1, "cm2": 100, "in2": 645.16 },
    len:   { "mm": 1, "cm": 10, "m": 1000, "in": 25.4 },
    force: { "kN": 1, "N": 0.001, "kgf": 0.00980665, "lbf": 0.004448222, "tf": 9.80665 }
  };
  var LABEL = { mm2: "mm²", cm2: "cm²", in2: "in²",
                mm: "mm", cm: "cm", m: "m", in: "in",
                kN: "kN", N: "N", kgf: "kgf", lbf: "lbf", tf: "tf" };
  var U = { area: "mm2", len: "mm", force: "kN" };

  var fmt = function (v, d) { return v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }); };
  function auto(v) { var a = Math.abs(v); return a >= 1000 ? 0 : a >= 100 ? 1 : a >= 1 ? 2 : 3; }
  function inForce(kN) { return kN / UNITS.force[U.force]; }
  function inLen(mm) { return mm / UNITS.len[U.len]; }
  function force(kN, tag) { var v = inForce(kN); return fmt(v, auto(v)) + (tag ? "<u>" + LABEL[U.force] + "</u>" : " " + LABEL[U.force]); }
  function len(mm, tag) { var v = inLen(mm); return fmt(v, auto(v)) + (tag ? "<u>" + LABEL[U.len] + "</u>" : " " + LABEL[U.len]); }

  /* ================= inference: evaluates the exported trees ================= */
  function buildFeatures(c) {
    var els = MODEL.elements, raw = [], fil = [], i;
    for (i = 0; i < els.length; i++) {
      var v = c[els[i]], ok = (v !== undefined && v !== null && !isNaN(v));
      raw.push(ok ? +v : NaN); fil.push(ok ? +v : 0);
    }
    var g = function (n) { return fil[els.indexOf(n)]; };
    var C = g("C"), Mn = g("Mn"), Si = g("Si"), Cr = g("Cr");
    var Ni = g("Ni"), Mo = g("Mo"), V = g("V"), Cu = g("Cu");
    var total = 0; for (i = 0; i < fil.length; i++) total = total + fil[i];  // order matters
    var vals = {
      ce_iiw: C + Mn / 6 + (Cr + Mo + V) / 5 + (Ni + Cu) / 15,
      pcm: C + Si / 30 + Mn / 20 + Cu / 20 + Cr / 20 + Ni / 60 + Mo / 15 + V / 10,
      total_alloy: total, fe_balance: 100 - total,
      ss_proxy: 83 * Si + 32 * Mn + 33 * Ni + 11 * Cr + 11 * Mo + 39 * Cu,
      carbide_former: Cr + Mo + V,
      cr_eq_schaeffler: Cr + Mo + 1.5 * Si,
      ni_eq_schaeffler: Ni + 30 * C + 0.5 * Mn
    };
    for (i = 0; i < els.length; i++) vals[els[i]] = fil[i];
    for (i = 0; i < MODEL.indicator_elements.length; i++) {
      var e = MODEL.indicator_elements[i];
      vals["missing__" + e] = isNaN(raw[els.indexOf(e)]) ? 1 : 0;
    }
    return MODEL.feature_names.map(function (n) { return vals[n]; });
  }
  function treeValue(t, x) {
    var n = 0;
    for (var s = 0; s < 4096; s++) {
      if (t.lf[n]) return t.v[n];
      var v = x[t.f[n]];
      n = isNaN(v) ? (t.m[n] ? t.l[n] : t.r[n]) : (v <= t.th[n] ? t.l[n] : t.r[n]);
    }
    throw new Error("no leaf");
  }
  function comp(name, x) {
    var c = MODEL.components[name], z = c.baseline;
    for (var i = 0; i < c.trees.length; i++) z += treeValue(c.trees[i], x);
    return c.link === "log" ? Math.exp(z) : 1 / (1 + Math.exp(-z));
  }
  function predict(c) {
    var x = buildFeatures(c);
    var uts = comp("tensile_strength", x), ratio = comp("yield_ratio", x);
    var ys = uts * ratio;
    if (!(ys < uts)) ys = uts * (1 - Number.EPSILON);
    return { ys: ys, uts: uts, el: comp("elongation", x) };
  }

  /* ================= engineering ================= */
  function engineering(p, area, gauge) {
    var ext = (p.el / 100) * gauge;
    return {
      area: area, gauge: gauge,
      yieldForce: p.ys * area / 1000, breakForce: p.uts * area / 1000,
      extBreak: ext, finalLength: gauge + ext,
      stiffness: E_MODULUS * area / gauge / 1000,
      /* Reduction of area is not a model output, but SteelBench reports it for
         414 heats; a fit over those gives RA% = 0.47*EL% + 31.8. Using the data's
         own relation keeps the neck honest rather than invented. */
      reductionOfArea: Math.max(0.10, Math.min(0.70, (0.47 * p.el + 31.8) / 100))
    };
  }

  function curveOf(p, eng) {
    var epsTotal = p.el / 100, epsYield = p.ys / E_MODULUS;
    var n = Math.max(0.02, Math.min(0.30, Math.log(p.uts / p.ys) / 2 + 0.05));
    var epsUts = Math.min(Math.max(n, epsYield * 2), Math.max(epsTotal * 0.75, epsYield * 1.001));
    epsUts = Math.max(epsYield * 1.001, Math.min(epsUts, epsTotal * 0.999));
    var K = p.uts / Math.pow(Math.max(epsUts, 1e-9), n);
    var pts = [], N = 240;
    for (var i = 0; i < N; i++) {
      var e = (i / (N - 1)) * epsTotal, s;
      if (e <= epsYield) s = E_MODULUS * e;
      else if (e <= epsUts) s = Math.min(K * Math.pow(e, n), p.uts);
      else { var t = (e - epsUts) / Math.max(epsTotal - epsUts, 1e-9); s = p.uts * (1 - 0.35 * t * t); }
      pts.push({ x: e * eng.gauge, y: s * eng.area / 1000, strain: e });
    }
    return { pts: pts, epsYield: epsYield, epsUts: epsUts, epsTotal: epsTotal };
  }

  /* ================= state ================= */
  var PRESETS = [
    { n: "1045", c: { C: 0.45, Mn: 0.75, Si: 0.25 } },
    { n: "4140", c: { C: 0.40, Mn: 0.88, Si: 0.23, Cr: 0.95, Mo: 0.20 } },
    { n: "S355", c: { C: 0.18, Mn: 1.50, Si: 0.40, Cu: 0.30 } },
    { n: "304", c: { C: 0.06, Mn: 1.50, Si: 0.50, Cr: 18.5, Ni: 9.0 } }
  ];
  var S = { c: {}, invalid: [], preset: null, mode: "pull",
            area: 78.5, gauge: 50, target: 45, p: null, eng: null, curve: null };
  var el = {};
  ["presets", "els", "run", "guard", "curve", "viewport", "phase", "results", "tiles",
   "verdict", "area", "gauge", "target", "load-row", "mode-pull", "mode-load",
   "u-area", "u-len", "u-force", "live-force", "live-ext", "live-len",
   "s-ys", "s-uts", "s-el", "s-ra"]
    .forEach(function (id) { el[id] = document.getElementById(id); });

  /* ---- build the sidebar ---- */
  MODEL.elements.forEach(function (name) {
    var r = MODEL.element_ranges[name];
    var w = document.createElement("div");
    w.className = "f";
    w.innerHTML = '<label for="el-' + name + '">' + name +
      '<span class="rng">' + fmt(r.min, 2) + "–" + fmt(r.max, r.max >= 10 ? 0 : 2) + '</span></label>' +
      '<input id="el-' + name + '" type="number" min="0" max="100" step="0.01" inputmode="decimal">';
    el.els.appendChild(w);
    el["el-" + name] = w.querySelector("input");
    el["w-" + name] = w;
  });
  PRESETS.forEach(function (p) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = p.n;
    b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function () { apply(p); });
    el.presets.appendChild(b); p.node = b;
  });

  function fillUnits(sel, kind) {
    Object.keys(UNITS[kind]).forEach(function (u) {
      var o = document.createElement("option");
      o.value = u; o.textContent = LABEL[u];
      sel.appendChild(o);
    });
    sel.value = U[kind];
    sel.addEventListener("change", function () {
      // Keep the physical quantity and rewrite the number, so switching mm to in
      // does not silently turn a 50 mm bar into a 50 inch one.
      var input = kind === "area" ? el.area : kind === "len" ? el.gauge : el.target;
      var old = UNITS[kind][U[kind]], now = UNITS[kind][sel.value];
      var v = parseFloat(input.value);
      if (isFinite(v)) input.value = String(Math.round(v * old / now * 1e6) / 1e6);
      U[kind] = sel.value;
      read(); recompute(); showResults(); rest();
    });
  }
  fillUnits(el["u-area"], "area"); fillUnits(el["u-len"], "len"); fillUnits(el["u-force"], "force");

  function apply(p) {
    S.preset = p.n;
    MODEL.elements.forEach(function (n) { el["el-" + n].value = p.c[n] === undefined ? "" : p.c[n]; });
    read(); recompute(); showResults(); rest();
  }

  function num(input, kind, lo, fallback) {
    var v = parseFloat(input.value);
    if (!isFinite(v) || v <= 0) return { v: fallback, bad: input.value.trim() !== "" };
    return { v: v * UNITS[kind][U[kind]], bad: false };
  }

  function read() {
    var c = {}, invalid = [];
    MODEL.elements.forEach(function (n) {
      var raw = el["el-" + n].value.trim();
      if (raw === "") return;
      var v = parseFloat(raw);
      // Physically impossible values are rejected here rather than passed to the
      // model and labelled "extrapolation".
      if (!isFinite(v) || v < 0 || v > 100) { invalid.push({ el: n, v: raw }); return; }
      c[n] = v;
    });
    S.c = c; S.invalid = invalid;
    // The .bad flag used to be computed and never read, so a negative or
    // unparseable dimension silently fell back to the default and the page
    // showed a confident force underneath it with no indication at all.
    var a = num(el.area, "area", 0, 78.5), g = num(el.gauge, "len", 0, 50),
        f = num(el.target, "force", 0, 45);
    S.area = a.v; S.gauge = g.v; S.target = f.v;
    S.badGeom = [];
    if (a.bad) S.badGeom.push({ id: "area", name: "Cross-section", shown: fmt(78.5 / UNITS.area[U.area], 3) + " " + LABEL[U.area] });
    if (g.bad) S.badGeom.push({ id: "gauge", name: "Length", shown: fmt(50 / UNITS.len[U.len], 3) + " " + LABEL[U.len] });
    if (f.bad && S.mode === "load") S.badGeom.push({ id: "target", name: "Load", shown: fmt(45 / UNITS.force[U.force], 3) + " " + LABEL[U.force] });
  }

  function guardLines() {
    var out = [];
    (S.badGeom || []).forEach(function (g) {
      out.push({ bad: true, geom: g.id, el: null,
                 text: g.name + " is not a usable dimension \u2014 using " + g.shown + " until it is corrected." });
    });
    S.invalid.forEach(function (f) {
      out.push({ bad: true, el: f.el, text: f.v + " wt% is not a possible composition. Ignored." });
    });
    Object.keys(S.c).forEach(function (e) {
      var v = S.c[e], r = MODEL.element_ranges[e];
      if (!r || v === 0) return;   // 0 means "not added", same as leaving it blank
      if (v > r.max) out.push({ el: e, text: fmt(v, 2) + " wt% is above anything in the training data (max " + fmt(r.max, 2) + "). Extrapolation." });
      else if (v < r.min) out.push({ el: e, text: fmt(v, 3) + " wt% is below the lowest the model saw (" + fmt(r.min, 2) + ")." });
    });
    if (Object.keys(S.c).length === 0 && S.invalid.length === 0) {
      out.push({ el: null, text: "No composition entered — this is what the model predicts for a steel with nothing specified." });
    }
    return out;
  }

  /* ================= results ================= */
  var TILES = {
    pull: [{ k: "Force at yield", id: "t-yf", key: true }, { k: "Force at break", id: "t-bf", key: true },
           { k: "Stretch before break", id: "t-ext" }, { k: "Length at break", id: "t-len" }],
    load: [{ k: "Load applied", id: "t-app", key: true }, { k: "Stretch under load", id: "t-ext" },
           { k: "Permanent stretch", id: "t-perm", key: true }, { k: "Length after unloading", id: "t-len" }]
  };
  function buildTiles() {
    el.tiles.innerHTML = "";
    TILES[S.mode].forEach(function (t) {
      var d = document.createElement("div");
      d.className = "tile" + (t.key ? " key" : "");
      d.innerHTML = '<div class="lab">' + t.k + '</div><div class="v" id="' + t.id + '">&mdash;</div>';
      el.tiles.appendChild(d);
      el[t.id] = d.querySelector(".v");
    });
  }

  function recompute() {
    S.p = predict(S.c);
    S.eng = engineering(S.p, S.area, S.gauge);
    S.curve = curveOf(S.p, S.eng);
    PRESETS.forEach(function (p) { p.node.setAttribute("aria-pressed", String(p.n === S.preset)); });

    MODEL.elements.forEach(function (n) { el["w-" + n].classList.remove("flag", "bad"); });
    ["area", "gauge", "target"].forEach(function (n) {
      var w = el[n].closest(".f"); if (w) w.classList.remove("bad");
    });
    el.guard.innerHTML = "";
    guardLines().forEach(function (f) {
      if (f.el) el["w-" + f.el].classList.add(f.bad ? "bad" : "flag");
      if (f.geom) { var w = el[f.geom].closest(".f"); if (w) w.classList.add("bad"); }
      var d = document.createElement("div");
      d.className = "flagline" + (f.bad ? " bad" : "");
      d.innerHTML = (f.el ? "<b>" + f.el + "</b> " : "") + f.text;
      el.guard.appendChild(d);
    });
    drawCurve(1, null);
  }

  /* Under dead load the bar is unstable the instant the applied force reaches the
     maximum it can carry, so that is the rupture criterion -- not fracture strain. */
  function loadOutcome() {
    var e = S.eng, F = S.target;
    if (F >= e.breakForce) return { broke: true, peak: e.breakForce };

    // Below yield the answer is Hooke's law, so use it. Reading the elastic
    // response off the 240-point curve snapped every load under ~11 kN to the
    // same first sample -- 21x too much stretch at 0.5 kN -- and left a non-zero
    // "permanent stretch" sitting under a verdict that said it springs back.
    // Only ~4 of those 240 samples cover the elastic range, because it is under
    // 2% of the strain axis.
    if (F <= e.yieldForce) {
      var elastic = F / e.stiffness;
      return { broke: false, peak: F, ext: elastic, strain: elastic / e.gauge,
               permanent: 0, yielded: false, finalLength: e.gauge };
    }

    // Past yield, interpolate between the bracketing samples rather than
    // snapping to the first one that clears the target.
    var pts = S.curve.pts, i, hit = pts[pts.length - 1];
    for (i = 1; i < pts.length; i++) {
      if (pts[i].strain > S.curve.epsUts) { hit = pts[i - 1]; break; }
      if (pts[i].y >= F) {
        var a = pts[i - 1], b = pts[i];
        var f = b.y === a.y ? 0 : (F - a.y) / (b.y - a.y);
        hit = { x: a.x + (b.x - a.x) * f, y: F, strain: a.strain + (b.strain - a.strain) * f };
        break;
      }
    }
    var permanent = Math.max(0, hit.x - F / e.stiffness);
    return { broke: false, peak: F, ext: hit.x, strain: hit.strain, permanent: permanent,
             yielded: true, finalLength: e.gauge + permanent };
  }

  function showResults(outcome) {
    var e = S.eng, p = S.p;
    if (S.mode === "pull") {
      el["t-yf"].innerHTML = force(e.yieldForce, true);
      el["t-bf"].innerHTML = force(e.breakForce, true);
      el["t-ext"].innerHTML = len(e.extBreak, true);
      el["t-len"].innerHTML = len(e.finalLength, true);
      el.verdict.className = "verdict broke";
      el.verdict.textContent = "Ruptures at " + force(e.breakForce, false);
    } else {
      var o = outcome || loadOutcome();
      el["t-app"].innerHTML = force(o.peak, true);
      el["t-ext"].innerHTML = o.broke ? "&mdash;" : len(o.ext, true);
      // If the verdict says it springs back, the tiles must say so too.
      var perm = o.yielded ? o.permanent : 0;
      el["t-perm"].innerHTML = o.broke ? "&mdash;" : len(perm, true);
      el["t-len"].innerHTML = o.broke ? "&mdash;" : len(e.gauge + perm, true);
      if (o.broke) {
        el.verdict.className = "verdict broke";
        el.verdict.textContent = "Ruptures — it carries " + force(e.breakForce, false) + " at most";
      } else if (o.yielded) {
        el.verdict.className = "verdict yielded";
        el.verdict.textContent = "Holds, but yields — " + len(o.permanent, false) + " stays";
      } else {
        el.verdict.className = "verdict held";
        el.verdict.textContent = "Holds — springs back to " + len(e.gauge, false);
      }
    }
    el["s-ys"].textContent = fmt(p.ys, 0) + " MPa";
    el["s-uts"].textContent = fmt(p.uts, 0) + " MPa";
    el["s-el"].textContent = fmt(p.el, 1) + " %";
    el["s-ra"].textContent = fmt(e.reductionOfArea * 100, 0) + " %";
    el.results.classList.remove("pending");
  }
  function hideResults() { el.results.classList.add("pending"); }

  /* ================= curve ================= */
  var cc = el.curve.getContext("2d");
  var css = function (n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); };

  function drawCurve(progress, marker) {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = el.curve.clientWidth, h = el.curve.clientHeight;
    if (!w) return;
    var cw = Math.round(w * dpr), ch = Math.round(h * dpr);
    if (el.curve.width !== cw || el.curve.height !== ch) { el.curve.width = cw; el.curve.height = ch; }
    cc.setTransform(dpr, 0, 0, dpr, 0, 0);
    cc.clearRect(0, 0, w, h);
    if (!S.curve) return;

    var padL = 44, padR = 10, padT = 16, padB = 20, i;
    var pts = S.curve.pts;
    var maxX = inLen(pts[pts.length - 1].x) * 1.05;
    var maxY = inForce(S.eng.breakForce) * 1.18;
    if (S.mode === "load") maxY = Math.max(maxY, inForce(S.target) * 1.1);
    var X = function (v) { return padL + (inLen(v) / maxX) * (w - padL - padR); };
    var Y = function (v) { return h - padB - (inForce(v) / maxY) * (h - padT - padB); };

    cc.font = '500 9px "IBM Plex Mono", monospace';
    cc.strokeStyle = css("--line-2"); cc.lineWidth = 1; cc.fillStyle = css("--muted");
    for (i = 0; i <= 3; i++) {
      var yv = maxY * i / 3, py = h - padB - (yv / maxY) * (h - padT - padB);
      cc.beginPath(); cc.moveTo(padL, py); cc.lineTo(w - padR, py); cc.stroke();
      cc.textAlign = "right"; cc.textBaseline = "middle";
      cc.fillText(fmt(yv, yv < 10 ? 1 : 0), padL - 5, py);
    }
    for (i = 0; i <= 4; i++) {
      var xv = maxX * i / 4, px = padL + (xv / maxX) * (w - padL - padR);
      cc.textAlign = "center"; cc.textBaseline = "top";
      cc.fillText(fmt(xv, xv < 10 ? 1 : 0), px, h - padB + 5);
    }
    cc.textAlign = "left"; cc.textBaseline = "top"; cc.fillText(LABEL[U.force], 5, 5);
    cc.textAlign = "right"; cc.fillText(LABEL[U.len], w - padR, h - 10);

    cc.strokeStyle = css("--muted"); cc.beginPath();
    cc.moveTo(padL, padT); cc.lineTo(padL, h - padB); cc.lineTo(w - padR, h - padB); cc.stroke();

    var last = Math.max(1, Math.floor(pts.length * progress));
    cc.strokeStyle = css("--accent"); cc.lineWidth = 2; cc.lineJoin = "round";
    cc.beginPath();
    for (i = 0; i < last; i++) {
      var p = pts[i];
      if (i === 0) cc.moveTo(X(p.x), Y(p.y)); else cc.lineTo(X(p.x), Y(p.y));
    }
    cc.stroke();

    function mark(strain, f, label, colour) {
      if (pts[last - 1].strain < strain - 1e-9) return;
      var px = X(strain * S.eng.gauge), py = Y(f);
      cc.fillStyle = colour;
      cc.beginPath(); cc.arc(px, py, 3.2, 0, Math.PI * 2); cc.fill();
      cc.font = '600 9px "IBM Plex Mono", monospace';
      cc.textAlign = "left"; cc.textBaseline = "bottom";
      cc.fillText(label, Math.min(px + 5, w - padR - 34), py - 4);
    }
    mark(S.curve.epsYield, S.eng.yieldForce, "YIELD", css("--steel"));
    mark(S.curve.epsUts, S.eng.breakForce, "MAX", css("--accent"));

    if (S.mode === "load" && S.target > 0) {
      var ty = Y(Math.min(S.target, S.eng.breakForce * 1.18));
      cc.setLineDash([4, 4]); cc.strokeStyle = css("--steel"); cc.lineWidth = 1.3;
      cc.beginPath(); cc.moveTo(padL, ty); cc.lineTo(w - padR, ty); cc.stroke();
      cc.setLineDash([]);
    }
    if (marker) {
      cc.fillStyle = css("--ink");
      cc.beginPath(); cc.arc(X(marker.x), Y(marker.y), 3.4, 0, Math.PI * 2); cc.fill();
    }
  }

  /* ================= 3D specimen ================= */
  var renderer, scene, camera, barA, barB, gripL, gripR;
  var GH = 1.2, ENDL = 0.62, RINGS = 56, SEG = 30;
  var orbit = { az: 0.42, pol: 1.16, dist: 8.4 }, userZoomed = false;

  /* The default view has to show the break, which is the point of the page.
     The specimen's half-extent after fracture (stretched gauge + shoulder +
     separation + grip) has to fit the horizontal field of view, and that depends
     on the window's aspect ratio -- a fixed distance cropped a grip off the edge
     at every desktop size tested. */
  function fitDistance() {
    if (!camera) return 8.4;
    var halfExtent = GH * 1.35 + ENDL + 0.34 + 0.35;
    var vFov = camera.fov * Math.PI / 180;
    var need = halfExtent / (Math.tan(vFov / 2) * Math.max(camera.aspect, 0.4));
    return Math.max(3.2, Math.min(11, need * 1.08));
  }

  function initThree() {
    renderer = new THREE.WebGLRenderer({ canvas: el.viewport, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(30, 2, 0.1, 100);
    scene.add(new THREE.HemisphereLight(0xdfe8f2, 0x2b3238, 0.9));
    var key = new THREE.DirectionalLight(0xffffff, 0.95); key.position.set(3, 5, 4); scene.add(key);
    var rim = new THREE.DirectionalLight(0xffc9a0, 0.45); rim.position.set(-4, 1.5, -3); scene.add(rim);
    var steel = new THREE.MeshStandardMaterial({ color: 0x9aa6b0, metalness: 0.85, roughness: 0.34 });
    var grip = new THREE.MeshStandardMaterial({ color: 0x4a545c, metalness: 0.55, roughness: 0.65 });
    barA = new THREE.Mesh(makeTube(), steel);
    barB = new THREE.Mesh(makeTube(), steel);
    scene.add(barA, barB);
    var jaw = new THREE.BoxGeometry(0.3, 0.8, 0.8);
    gripL = new THREE.Mesh(jaw, grip); gripR = new THREE.Mesh(jaw, grip);
    scene.add(gripL, gripR);
    bindOrbit(); updateCamera(); resize();
    window.addEventListener("resize", function () { resize(); drawCurve(prog, null); });
  }

  function makeTube() {
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array((RINGS * SEG + 2) * 3), 3));
    var idx = [], i, j;
    for (i = 0; i < RINGS - 1; i++) {
      for (j = 0; j < SEG; j++) {
        var a = i * SEG + j, b = i * SEG + (j + 1) % SEG;
        var c = (i + 1) * SEG + j, d = (i + 1) * SEG + (j + 1) % SEG;
        idx.push(a, c, b, b, c, d);
      }
    }
    var capNear = RINGS * SEG, capFar = capNear + 1;
    for (j = 0; j < SEG; j++) {
      idx.push(capNear, j, (j + 1) % SEG);
      idx.push(capFar, (RINGS - 1) * SEG + (j + 1) % SEG, (RINGS - 1) * SEG + j);
    }
    g.setIndex(idx);
    return g;
  }

  var COS = [], SIN = [];
  for (var _s = 0; _s < SEG; _s++) { COS.push(Math.cos(_s / SEG * Math.PI * 2)); SIN.push(Math.sin(_s / SEG * Math.PI * 2)); }

  /* Uniform thinning until maximum load; past it the neck takes over, about 1.4
     diameters wide -- set by the current diameter, not the gauge length. */
  function profileAt(t, uniform, neck, gaugeHalf, r0, rNeckMin) {
    var rU = r0 / Math.sqrt(1 + Math.max(uniform, 0)), rG = r0 * 1.85, y, r;
    if (t <= 0.72) {
      y = t / 0.72 * gaugeHalf;
      if (neck > 0) {
        var width = Math.max(1.4 * rU, gaugeHalf * 0.10);
        r = rU - (rU - rNeckMin) * neck * Math.exp(-Math.pow(y / width, 2));
      } else r = rU;
    } else if (t <= 0.86) {
      var u = (t - 0.72) / 0.14;
      y = gaugeHalf + u * ENDL * 0.45;
      r = rU + (rG - rU) * (u * u * (3 - 2 * u));
    } else {
      var v = (t - 0.86) / 0.14;
      y = gaugeHalf + ENDL * 0.45 + v * ENDL * 0.55;
      r = rG;
    }
    return { y: y, r: Math.max(r, 0.002) };
  }

  /* Cup and cone: voids coalesce at the neck centre, the flat fibrous crack runs
     outward, the last ligament shears near the surface. Both cap centres shift
     the same way along the axis, so one half's cone seats in the other's cup. */
  function deform(mesh, sign, uniform, neck, gaugeHalf, r0, rNeckMin, capShift) {
    var pos = mesh.geometry.attributes.position, arr = pos.array, i, j, k = 0, first = null, last = null;
    for (i = 0; i < RINGS; i++) {
      var pr = profileAt(i / (RINGS - 1), uniform, neck, gaugeHalf, r0, rNeckMin);
      if (i === 0) first = pr;
      if (i === RINGS - 1) last = pr;
      var x = sign * pr.y;
      if (capShift !== 0 && i === 0) x += capShift * 0.22;   // shear lip at the rim
      for (j = 0; j < SEG; j++) { arr[k++] = x; arr[k++] = pr.r * COS[j]; arr[k++] = pr.r * SIN[j]; }
    }
    arr[k++] = sign * first.y + capShift; arr[k++] = 0; arr[k++] = 0;
    arr[k++] = sign * last.y; arr[k++] = 0; arr[k++] = 0;
    pos.needsUpdate = true;
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
  }

  function build(uniform, neck, split, fractured) {
    if (!barA) return;
    var dia = 2 * Math.sqrt(S.area / Math.PI);
    var r0 = Math.min(0.75, Math.max(0.045, (dia / S.gauge) * GH));
    var gh = GH * (1 + uniform);
    var rU = r0 / Math.sqrt(1 + Math.max(uniform, 0));
    var rNeckMin = rU * Math.sqrt(1 - (S.eng ? S.eng.reductionOfArea : 0.44));
    var capShift = fractured ? -Math.max(rNeckMin * 0.85, 0.01) : 0;
    deform(barA, 1, uniform, neck, gh, r0, rNeckMin, capShift);
    deform(barB, -1, uniform, neck, gh, r0, rNeckMin, capShift);
    barA.position.x = split; barB.position.x = -split;
    var end = gh + ENDL + split;
    gripR.position.x = end + 0.15; gripL.position.x = -end - 0.15;
  }

  function updateCamera() {
    var sp = Math.sin(orbit.pol), cp = Math.cos(orbit.pol);
    camera.position.set(orbit.dist * sp * Math.sin(orbit.az), orbit.dist * cp, orbit.dist * sp * Math.cos(orbit.az));
    camera.lookAt(0, 0, 0);
  }

  function bindOrbit() {
    var dragging = false, lx = 0, ly = 0;
    el.viewport.addEventListener("pointerdown", function (e) {
      dragging = true; lx = e.clientX; ly = e.clientY; el.viewport.setPointerCapture(e.pointerId);
    });
    el.viewport.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      orbit.az -= (e.clientX - lx) * 0.008;
      orbit.pol = Math.max(0.12, Math.min(Math.PI - 0.12, orbit.pol - (e.clientY - ly) * 0.008));
      lx = e.clientX; ly = e.clientY; updateCamera(); render();
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
      el.viewport.addEventListener(ev, function () { dragging = false; });
    });
    el.viewport.addEventListener("wheel", function (e) {
      e.preventDefault();
      userZoomed = true;
      orbit.dist = Math.max(2.4, Math.min(11, orbit.dist + Math.sign(e.deltaY) * 0.42));
      updateCamera(); render();
    }, { passive: false });
    el.viewport.addEventListener("keydown", function (e) {
      var k = e.key, step = 0.09, used = true;
      if (k === "ArrowLeft") orbit.az -= step;
      else if (k === "ArrowRight") orbit.az += step;
      else if (k === "ArrowUp") orbit.pol = Math.max(0.12, orbit.pol - step);
      else if (k === "ArrowDown") orbit.pol = Math.min(Math.PI - 0.12, orbit.pol + step);
      else if (k === "+" || k === "=") { userZoomed = true; orbit.dist = Math.max(2.4, orbit.dist - 0.4); }
      else if (k === "-" || k === "_") { userZoomed = true; orbit.dist = Math.min(11, orbit.dist + 0.4); }
      else used = false;
      if (used) { e.preventDefault(); updateCamera(); render(); }
    });
  }

  function resize() {
    var w = el.viewport.clientWidth, h = el.viewport.clientHeight;
    if (!w || !h || !renderer) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    if (!userZoomed) { orbit.dist = fitDistance(); updateCamera(); }
    render();
  }
  function render() { if (renderer) renderer.render(scene, camera); }

  function liveReadout(f, ext) {
    el["live-force"].innerHTML = force(f, true);
    el["live-ext"].innerHTML = len(ext, true);
    el["live-len"].innerHTML = len(S.gauge + ext, true);
  }
  function rest() { build(0, 0, 0, false); liveReadout(0, 0); el.phase.textContent = "At rest"; render(); }

  /* ================= the test ================= */
  var prog = 1, busy = false;
  function finish() { busy = false; el.run.disabled = false; }

  function run() {
    if (busy || !S.curve) return;
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    return S.mode === "load" ? runLoad(reduced) : runPull(reduced);
  }

  function runPull(reduced) {
    var c = S.curve, e = S.eng;
    if (reduced) {
      build(c.epsTotal * 2.2, 1, 0.34, true);
      el.phase.textContent = "Fractured"; liveReadout(0, e.extBreak);
      drawCurve(1, null); render(); showResults();
      return;
    }
    busy = true; el.run.disabled = true; hideResults();
    var pts = c.pts, dur = 3000, t0 = null;

    function frame(now) {
      if (t0 === null) t0 = now;
      if (now - t0 > 14000) { snap(); return; }
      var k = Math.max(0, Math.min(1, (now - t0) / dur));
      var p = pts[Math.min(pts.length - 1, Math.floor(k * (pts.length - 1)))];
      var uniform, neck;
      if (p.strain <= c.epsUts) { uniform = p.strain; neck = 0; }
      else {
        uniform = c.epsUts;
        neck = Math.pow((p.strain - c.epsUts) / Math.max(c.epsTotal - c.epsUts, 1e-9), 0.65);
      }
      build(uniform * 2.2, neck, 0, false);
      liveReadout(p.y, p.x);
      el.phase.textContent = p.strain <= c.epsYield ? "Elastic"
        : p.strain <= c.epsUts ? "Work hardening" : "Necking";
      drawCurve(k, p); render(); prog = k;
      if (k < 1) requestAnimationFrame(safeFrame); else snap();
    }
    function safeFrame(now) {
      try { frame(now); }
      catch (err) { showResults(); el.phase.textContent = "Fractured"; finish(); throw err; }
    }
    requestAnimationFrame(safeFrame);
  }

  function snap() {
    var t0 = null, dur = 700, c = S.curve;
    el.phase.textContent = "Fractured";
    liveReadout(0, S.eng.extBreak);
    showResults();
    el.results.classList.add("flash");
    setTimeout(function () { el.results.classList.remove("flash"); }, 520);
    function frame(now) {
      if (t0 === null) t0 = now;
      var k = Math.max(0, Math.min(1, (now - t0) / dur)), ease = 1 - Math.pow(1 - k, 3);
      build(c.epsUts * 2.2 * (1 - 0.012 * ease), 1, 0.34 * ease, true);
      render();
      if (k < 1) requestAnimationFrame(safeFrame); else finish();
    }
    function safeFrame(now) { try { frame(now); } catch (err) { finish(); throw err; } }
    requestAnimationFrame(safeFrame);
  }

  function runLoad(reduced) {
    var o = loadOutcome(), c = S.curve, e = S.eng;
    if (reduced) {
      if (o.broke) { build(c.epsUts * 2.2, 1, 0.34, true); el.phase.textContent = "Fractured"; liveReadout(0, e.extBreak); }
      else { build(o.strain * 2.2, 0, 0, false); el.phase.textContent = "Holding"; liveReadout(o.peak, o.ext); }
      drawCurve(1, null); render(); showResults(o);
      return;
    }
    busy = true; el.run.disabled = true; hideResults();
    var peak = o.broke ? e.breakForce : S.target, dur = 2400, t0 = null, pts = c.pts;

    function frame(now) {
      if (t0 === null) t0 = now;
      if (now - t0 > 14000) { settle(o); return; }
      var k = Math.max(0, Math.min(1, (now - t0) / dur));
      var F = peak * k, hit = pts[0], i;
      for (i = 0; i < pts.length; i++) {
        if (pts[i].strain > c.epsUts) break;
        if (pts[i].y <= F) hit = pts[i]; else break;
      }
      build(Math.min(hit.strain, c.epsUts) * 2.2, 0, 0, false);
      liveReadout(F, hit.x);
      el.phase.textContent = F < e.yieldForce ? "Elastic" : "Yielding";
      drawCurve(Math.min(1, hit.strain / c.epsTotal), { x: hit.x, y: F });
      render();
      if (k < 1) requestAnimationFrame(safeFrame);
      else if (o.broke) snap();
      else settle(o);
    }
    function safeFrame(now) {
      try { frame(now); } catch (err) { showResults(o); finish(); throw err; }
    }
    requestAnimationFrame(safeFrame);
  }

  function settle(o) {
    var t0 = null, dur = 700;
    el.phase.textContent = o.yielded ? "Unloading" : "Unloading";
    showResults(o);
    el.results.classList.add("flash");
    setTimeout(function () { el.results.classList.remove("flash"); }, 520);
    function frame(now) {
      if (t0 === null) t0 = now;
      var k = Math.max(0, Math.min(1, (now - t0) / dur)), ease = 1 - Math.pow(1 - k, 3);
      var strainNow = o.strain - (o.strain - o.permanent / S.gauge) * ease;
      build(strainNow * 2.2, 0, 0, false);
      liveReadout(o.peak * (1 - ease), strainNow * S.gauge);
      render();
      if (k < 1) requestAnimationFrame(safeFrame);
      else { el.phase.textContent = o.yielded ? "Permanently stretched" : "Unchanged"; finish(); }
    }
    function safeFrame(now) { try { frame(now); } catch (err) { finish(); throw err; } }
    requestAnimationFrame(safeFrame);
  }

  /* ================= wiring ================= */
  function setMode(mode) {
    S.mode = mode;
    el["mode-pull"].setAttribute("aria-pressed", String(mode === "pull"));
    el["mode-load"].setAttribute("aria-pressed", String(mode === "load"));
    el["load-row"].hidden = mode !== "load";
    el.run.textContent = mode === "pull" ? "Pull to failure" : "Apply the load";
    buildTiles(); read(); recompute(); showResults(); rest();
  }
  el["mode-pull"].addEventListener("click", function () { setMode("pull"); });
  el["mode-load"].addEventListener("click", function () { setMode("load"); });

  MODEL.elements.forEach(function (n) {
    el["el-" + n].addEventListener("input", function () {
      S.preset = null; read(); recompute(); showResults(); rest();
    });
  });
  [el.area, el.gauge, el.target].forEach(function (input) {
    input.addEventListener("input", function () { read(); recompute(); showResults(); rest(); });
  });
  el.run.addEventListener("click", run);
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(function () { drawCurve(prog, null); });

  // Numbers first: the prediction needs neither three.js nor WebGL.
  buildTiles();
  apply(PRESETS[1]);
  try { initThree(); rest(); }
  catch (err) {
    el.viewport.hidden = true;
    el.phase.textContent = "3D view unavailable";
    if (window.console) console.warn("3D view disabled:", err && err.message);
  }
})();
</script>
