<title>Tensile Test Bench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root {
    --ground: #dde2e4;
    --stage: #d8dde0;
    --stage-hi: #f8faf9;
    --stage-lo: #929da5;
    --surface: #fbfaf7;
    --surface-2: #f0f1ee;
    --ink: #111719;
    --ink-2: #344148;
    --muted: #6a7479;
    --line: #c7cdcf;
    --line-2: #dfe3e2;
    --accent: #c84a1b;
    --accent-hi: #e65a24;
    --accent-soft: rgba(200, 74, 27, .09);
    --steel: #35596c;
    --grid: rgba(42, 58, 66, .055);
    --warn: #8f5c10;
    --bad: #a32c2c;
    --good: #2c6a4c;
    --panel-bg: rgba(251, 250, 247, .94);
    --shadow: 0 1px 2px rgba(20, 30, 40, .08), 0 14px 38px rgba(20, 30, 40, .12);
    --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --f-body: "Barlow", system-ui, -apple-system, sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --bar: 326px;
    --hud: 154px;
    --lift: 48px; /* stage cropped from the bottom and the readout bar raised by the same amount */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0b0f11; --stage: #161c20; --stage-hi: #2b343a; --stage-lo: #07090a;
      --surface: #14191b; --surface-2: #1b2225;
      --ink: #eef1ef; --ink-2: #c0c8c9; --muted: #929da1;
      --line: #30393d; --line-2: #242d31;
      --accent: #ff7b3d; --accent-hi: #ff965f; --accent-soft: rgba(255, 123, 61, .10);
      --steel: #8bb7ca; --grid: rgba(210, 225, 230, .055); --warn: #d9a33f;
      --bad: #e4736b; --good: #63b98c;
      --panel-bg: rgba(20, 25, 27, .94);
      --shadow: 0 1px 2px rgba(0,0,0,.55), 0 16px 42px rgba(0,0,0,.46);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0b0f11; --stage: #161c20; --stage-hi: #2b343a; --stage-lo: #07090a;
    --surface: #14191b; --surface-2: #1b2225;
    --ink: #eef1ef; --ink-2: #c0c8c9; --muted: #929da1;
    --line: #30393d; --line-2: #242d31;
    --accent: #ff7b3d; --accent-hi: #ff965f; --accent-soft: rgba(255, 123, 61, .10);
    --steel: #8bb7ca; --grid: rgba(210, 225, 230, .055); --warn: #d9a33f;
    --bad: #e4736b; --good: #63b98c;
    --panel-bg: rgba(20, 25, 27, .94);
    --shadow: 0 1px 2px rgba(0,0,0,.55), 0 16px 42px rgba(0,0,0,.46);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0; }
  button, input, select { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  .lab { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); }

  /* ================= desktop: the simulation IS the page ================= */
  /* The canvas fills everything right of the sidebar and ABOVE the readout bar.
     The specimen is the page; nothing is drawn on top of it. */
  /* The canvas is a REPLACED element: width/height:auto resolve to its intrinsic
     300x150, not to the inset box, so positioning it directly left it at 300x150
     however many insets were set. The wrapper owns the geometry; the canvas just
     fills it. */
  /* A lit room rather than a flat fill: light in the middle where the specimen
     sits, falling off toward the corners, with a soft inset shadow standing in
     for where the walls meet. */
  .stagewrap {
    position: fixed; top: 0; right: 0; bottom: calc(var(--hud) + var(--lift)); left: var(--bar);
    z-index: 0; overflow: hidden;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px),
      radial-gradient(115% 88% at 50% 32%,
        var(--stage-hi) 0%, var(--stage) 42%, var(--stage-lo) 100%);
    background-size: 42px 42px, 42px 42px, auto;
    background-position: center center;
  }
  .stagewrap::before {
    content: ""; position: absolute; inset: 20px; z-index: 1; pointer-events: none;
    border: 1px solid color-mix(in srgb, var(--line) 48%, transparent);
    opacity: .72;
    clip-path: polygon(0 0, 46px 0, 46px 1px, calc(100% - 46px) 1px, calc(100% - 46px) 0, 100% 0, 100% 46px, calc(100% - 1px) 46px, calc(100% - 1px) calc(100% - 46px), 100% calc(100% - 46px), 100% 100%, calc(100% - 46px) 100%, calc(100% - 46px) calc(100% - 1px), 46px calc(100% - 1px), 46px 100%, 0 100%, 0 calc(100% - 46px), 1px calc(100% - 46px), 1px 46px, 0 46px);
  }
  .stagewrap::after {
    content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    box-shadow: inset 0 0 170px 30px rgba(18, 26, 34, .18),
                inset 0 -80px 130px -60px rgba(18, 26, 34, .38),
                inset 0 60px 110px -70px rgba(18, 26, 34, .22);
  }
  #viewport {
    display: block; width: 100%; height: 100%; background: transparent;
    position: relative; z-index: 2;
    touch-action: none; cursor: grab;
  }
  #viewport:active { cursor: grabbing; }
  #viewport:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  .stage-hint {
    position: absolute; top: 20px; right: 20px; z-index: 3; pointer-events: none;
    display: flex; align-items: center; gap: 7px;
    padding: 6px 9px; border: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
    border-radius: 999px; background: var(--panel-bg); box-shadow: 0 3px 12px rgba(24, 34, 39, .08);
    color: var(--ink-2); font-family: var(--f-mono); font-size: 8.5px; letter-spacing: .09em; text-transform: uppercase;
    backdrop-filter: blur(8px);
  }
  .stage-hint::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .stage-hint .sep { color: var(--line); }

  .side {
    position: fixed; top: 0; left: 0; bottom: 0; width: var(--bar); z-index: 3;
    background: var(--surface); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
    padding: calc(env(safe-area-inset-top, 0px) + 15px) 15px calc(env(safe-area-inset-bottom, 0px) + 15px);
    gap: 11px;
    box-shadow: 12px 0 34px rgba(23, 32, 37, .10);
  }
  .brand { display: flex; align-items: stretch; gap: 10px; padding-bottom: 11px; border-bottom: 1px solid var(--line-2); }
  .brand-line { display: block; width: 4px; border-radius: 1px; background: linear-gradient(180deg, var(--accent-hi), var(--accent)); box-shadow: 0 0 0 1px var(--accent-soft); }
  .brand-name { font-family: var(--f-mono); font-size: 8.5px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); line-height: 1; margin: 1px 0 5px; }
  .side h1 { font-family: var(--f-display); font-size: 23px; font-weight: 700; text-transform: uppercase; letter-spacing: .025em; margin: 0; line-height: .92; }
  .grow { flex: 1 1 auto; min-height: 0; }

  /* A solid bar BELOW the stage, not a card floating over it. The specimen is
     the point of the page; covering it with the numbers defeats the layout. */
  .hud {
    position: fixed; left: var(--bar); right: 0; bottom: var(--lift); height: var(--hud); z-index: 2;
    background: var(--surface); border-top: 2px solid var(--ink);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-shadow: 0 -12px 34px rgba(19, 28, 34, .13);
  }
  .card { background: var(--surface); }

  .phase { font-family: var(--f-mono); font-size: 9.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); white-space: nowrap; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 24%, transparent); border-radius: 999px; padding: 3px 7px; }
  .hint { color: var(--muted); white-space: nowrap; }

  .hud-inner { display: flex; height: 100%; align-items: stretch; }
  .curve-card { flex: 0 0 326px; min-width: 0; padding: 8px 12px 5px; border-right: 1px solid var(--line); background: var(--surface-2); }
  #curve { display: block; width: 100%; height: 100%; }
  .out-card { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .verdictrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 36px; padding: 6px 14px; border-bottom: 1px solid var(--line-2); }
  .verdict { font-family: var(--f-display); font-size: 17px; font-weight: 700; letter-spacing: .025em; text-transform: uppercase; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .verdict.held { color: var(--good); } .verdict.yielded { color: var(--warn); } .verdict.broke { color: var(--bad); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 1px; background: var(--line-2); flex: 1 1 auto; }
  .tile { background: var(--surface); padding: 6px 14px; min-width: 0; transition: background .45s ease; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .tile.key::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; background: var(--accent); }
  .tile .v { font-family: var(--f-mono); font-size: clamp(15px, 1.4vw, 20px); font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.18; margin-top: 1px; white-space: nowrap; }
  .tile .v u { text-decoration: none; font-size: .5em; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .tile.key .v { color: var(--accent); }
  .out.pending .tile .v, .out.pending .verdict { color: var(--muted); opacity: .4; }
  .out.flash .tile { background: var(--surface-2); }
  /* What the model predicted, held steady -- not a ticker that changes while
     the animation runs. */
  .predicted { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line-2); border-top: 1px solid var(--line-2); }
  .predicted div { background: var(--surface-2); padding: 6px 14px; min-width: 0; }
  .predicted .v { font-family: var(--f-mono); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink-2); }

  /* ---- sidebar controls ---- */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; }
  .mode { font-family: var(--f-display); font-size: 13.5px; font-weight: 600; padding: 6px 4px; border: 0; background: transparent; color: var(--ink-2); border-radius: 3px; cursor: pointer; transition: background .18s ease, color .18s ease, box-shadow .18s ease; }
  .mode:hover { color: var(--ink); background: color-mix(in srgb, var(--surface) 62%, transparent); }
  .mode[aria-pressed="true"] { background: var(--steel); color: #fff; box-shadow: 0 2px 7px rgba(22, 43, 53, .22); }

  .block > .lab { display: block; margin-bottom: 5px; }
  .sub { font-family: var(--f-body); font-size: 11px; color: var(--muted); text-transform: none; letter-spacing: 0; margin-left: 6px; }
  .presets { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-family: var(--f-display); font-size: 13px; font-weight: 600; min-width: 40px; padding: 3px 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); border-radius: 3px; cursor: pointer; transition: border-color .18s ease, background .18s ease, color .18s ease; }
  .chip:hover { border-color: var(--steel); background: var(--surface); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 2px 7px var(--accent-soft); }

  .els { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .f { min-width: 0; }
  .f > label { display: flex; justify-content: space-between; align-items: baseline; gap: 3px; font-family: var(--f-mono); font-size: 9.5px; color: var(--muted); }
  .f > label .rng { font-size: 8px; opacity: .85; letter-spacing: -.02em; }
  .f input { width: 100%; min-height: 29px; font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; padding: 4px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); box-shadow: inset 0 1px 2px rgba(25, 35, 40, .035); transition: border-color .18s ease, box-shadow .18s ease, background .18s ease; }
  .f input:hover { border-color: color-mix(in srgb, var(--steel) 50%, var(--line)); }
  .f input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .f.flag input { border-color: var(--warn); }
  .f.bad input { border-color: var(--bad); }

  .withunit { display: grid; grid-template-columns: 1fr auto; gap: 4px; }
  select { font-family: var(--f-mono); font-size: 11px; padding: 4px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink-2); cursor: pointer; }
  select:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .geo { display: grid; gap: 6px; padding: 9px; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 6px; }
  .geo > .lab { margin-bottom: 0; }

  .run { width: 100%; min-height: 40px; padding: 9px; cursor: pointer; font-family: var(--f-display); font-size: 16px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; background: linear-gradient(135deg, var(--accent-hi), var(--accent)); color: #fff; border: 1px solid color-mix(in srgb, var(--accent) 82%, #000); border-radius: 4px; box-shadow: 0 5px 14px rgba(130, 50, 17, .18); transition: transform .18s ease, filter .18s ease, box-shadow .18s ease; }
  .run:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 7px 17px rgba(130, 50, 17, .23); }
  .run:active { transform: translateY(0); }
  .run:disabled { opacity: .5; cursor: progress; }
  .run:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Only this can ever scroll, and only when a run of flags is unusually long. */
  .guard { display: grid; gap: 4px; overflow-y: auto; max-height: 150px; }
  .guard:empty { display: none; }
  .flagline { font-size: 11.5px; line-height: 1.28; color: var(--ink-2); border: 1px solid var(--line-2); border-left: 3px solid var(--warn); border-radius: 3px; padding: 5px 7px; background: var(--surface-2); overflow-wrap: anywhere; min-width: 0; }
  .flagline.bad { border-left-color: var(--bad); }
  .flagline b { font-family: var(--f-mono); color: var(--warn); }
  .flagline.bad b { color: var(--bad); }
  .foot { font-size: 11px; color: var(--muted); }
  .foot a { color: var(--steel); }

  /* ================= narrow: back to normal flow ================= */
  @media (max-width: 899px) {
    html, body { height: auto; }
    .stagewrap { position: relative; inset: auto; background-size: 34px 34px, 34px 34px, auto; padding: 12px; }
    .stagewrap::before { inset: 24px; }
    .stage-hint { top: 22px; right: 22px; }
    .stage-hint .desktop-only { display: none; }
    #viewport { height: 44vh; min-height: 270px; border: 1px solid color-mix(in srgb, var(--line) 68%, transparent); border-radius: 7px; }
    .side { position: static; width: auto; border-right: none; border-bottom: 1px solid var(--line); box-shadow: 0 8px 24px rgba(21, 30, 35, .08); }
    .hud { position: static; left: auto; right: auto; height: auto; border-top: none; margin: 12px 12px 20px; background: transparent; box-shadow: none; }
    .hud-inner { flex-wrap: wrap; height: auto; }
    .curve-card { flex: 1 1 100%; border: 1px solid var(--line); border-bottom: none; border-radius: 7px 7px 0 0; padding: 9px 10px 5px; }
    #curve { height: 154px; }
    .out-card { flex: 1 1 100%; border: 1px solid var(--line); border-radius: 0 0 7px 7px; overflow: hidden; box-shadow: var(--shadow); }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .predicted { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (min-width: 900px) and (max-height: 760px) {
    .side { padding-top: 11px; padding-bottom: 11px; gap: 7px; }
    .brand { padding-bottom: 7px; }
    .brand-name { margin-bottom: 3px; }
    .side h1 { font-size: 21px; }
    .geo { padding: 7px; gap: 4px; }
    .f input { min-height: 27px; }
    .run { min-height: 36px; padding: 7px; }
  }

  @media (max-width: 520px) {
    .side { padding-left: 12px; padding-right: 12px; }
    .sub { display: block; margin: 2px 0 0; }
    .verdictrow { align-items: flex-start; }
    .verdict { white-space: normal; line-height: 1.05; }
    .tile, .predicted div { padding-left: 12px; padding-right: 10px; }
  }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<aside class="side">
  <header class="brand">
    <span class="brand-line" aria-hidden="true"></span>
    <div>
      <div class="brand-name">stresspredict</div>
      <h1>Tensile Test Bench</h1>
    </div>
  </header>

  <div class="modes">
    <button type="button" class="mode" id="mode-pull" aria-pressed="true">Pull to failure</button>
    <button type="button" class="mode" id="mode-load" aria-pressed="false">Apply a load</button>
  </div>

  <div class="block">
    <span class="lab">Presets <span class="sub">example chemistries &mdash; edit freely</span></span>
    <div class="presets" id="presets"></div>
  </div>

  <div class="block">
    <span class="lab">Composition &mdash; wt % <span class="sub">range the model has seen</span></span>
    <div class="els" id="els"></div>
  </div>

  <div class="block geo">
    <span class="lab">Specimen</span>
    <div class="f">
      <label for="area">Cross-section</label>
      <div class="withunit">
        <input id="area" type="number" min="0" step="1" value="78.5">
        <select id="u-area" aria-label="Cross-section unit"></select>
      </div>
    </div>
    <div class="f">
      <label for="gauge">Length</label>
      <div class="withunit">
        <input id="gauge" type="number" min="0" step="5" value="50">
        <select id="u-len" aria-label="Length unit"></select>
      </div>
    </div>
    <div class="f" id="load-row" hidden>
      <label for="target">Load to apply</label>
      <div class="withunit">
        <input id="target" type="number" min="0" step="1" value="45">
        <select id="u-force" aria-label="Load unit"></select>
      </div>
    </div>
  </div>

  <button class="run" id="run" type="button">Pull to failure</button>
  <div class="guard" id="guard"></div>
  <div class="grow"></div>
</aside>

<div class="stagewrap">
  <canvas id="viewport" tabindex="0" role="img"
          aria-label="3D view of the test specimen being pulled. Drag or use arrow keys to rotate; scroll or use plus and minus to zoom."></canvas>
  <div class="stage-hint" aria-hidden="true">
    <span>Drag to orbit</span><span class="sep desktop-only">/</span><span class="desktop-only">Scroll to zoom</span>
  </div>
</div>

<div class="hud">
  <div class="hud-inner">
    <div class="card curve-card">
      <canvas id="curve" role="img" aria-label="Load-extension curve from zero load to fracture"></canvas>
    </div>
    <div class="card out-card out" id="results">
      <div class="verdictrow">
        <span class="verdict" id="verdict" aria-live="polite">&mdash;</span>
        <span class="phase" id="phase">At rest</span>
      </div>
      <div class="tiles" id="tiles" aria-live="polite"></div>
      <div class="predicted">
        <div><div class="lab">Yield strength</div><div class="v" id="s-ys">&mdash;</div></div>
        <div><div class="lab">Tensile strength</div><div class="v" id="s-uts">&mdash;</div></div>
        <div><div class="lab">Elongation</div><div class="v" id="s-el">&mdash;</div></div>
        <div><div class="lab">Neck contraction</div><div class="v" id="s-ra">&mdash;</div></div>
      </div>
    </div>
  </div>
</div>

<script src="model.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";

  var MODEL = window.SP_MODEL;
  var E_MODULUS = 205000;            // MPa; ~constant for steel, so never modelled

  /* ================= units =================
     Everything inside is mm, mm^2 and kN. Units are a presentation layer on the
     way in and out, so no conversion factor can ever reach the model. */
  var UNITS = {
    area:  { "mm2": 1, "cm2": 100, "in2": 645.16 },
    len:   { "mm": 1, "cm": 10, "m": 1000, "in": 25.4 },
    force: { "kN": 1, "N": 0.001, "kgf": 0.00980665, "lbf": 0.004448222, "tf": 9.80665 }
  };
  var LABEL = { mm2: "mm²", cm2: "cm²", in2: "in²",
                mm: "mm", cm: "cm", m: "m", in: "in",
                kN: "kN", N: "N", kgf: "kgf", lbf: "lbf", tf: "tf" };
  var U = { area: "mm2", len: "mm", force: "kN" };

  var fmt = function (v, d) { return v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }); };
  function auto(v) { var a = Math.abs(v); return a >= 1000 ? 0 : a >= 100 ? 1 : a >= 1 ? 2 : 3; }
  function inForce(kN) { return kN / UNITS.force[U.force]; }
  function inLen(mm) { return mm / UNITS.len[U.len]; }
  function force(kN, tag) { var v = inForce(kN); return fmt(v, auto(v)) + (tag ? "<u>" + LABEL[U.force] + "</u>" : " " + LABEL[U.force]); }
  function len(mm, tag) { var v = inLen(mm); return fmt(v, auto(v)) + (tag ? "<u>" + LABEL[U.len] + "</u>" : " " + LABEL[U.len]); }

  /* ================= inference: evaluates the exported trees ================= */

      side: THREE.DoubleSide });
    var grip = new THREE.MeshStandardMaterial({
      color: 0x24282c, metalness: 0.18, roughness: 0.82, envMapIntensity: 0.22 });
    var torn = new THREE.MeshStandardMaterial({
      color: 0x7c8288, metalness: 0.08, roughness: 0.95, envMapIntensity: 0.18,
      side: THREE.DoubleSide, flatShading: true });
    barA = new THREE.Mesh(makeTube(), [steel, torn]);
    barB = new THREE.Mesh(makeTube(), [steel, torn]);
    scene.add(barA, barB);
    var jaw = new THREE.BoxGeometry(0.26, 0.62, 0.62);
    gripL = new THREE.Mesh(jaw, grip); gripR = new THREE.Mesh(jaw, grip);
    scene.add(gripL, gripR);
    bindOrbit(); updateCamera(); resize();
    window.addEventListener("resize", function () { resize(); drawCurve(prog, null); });
  }

  /* A vertical gradient stands in for a studio: bright above, mid at the
     horizon, dark below. Cheap, and enough for the steel to read as steel. */
  function roomEnvironment() {
    var c = document.createElement("canvas");
    c.width = 16; c.height = 256;
    var g = c.getContext("2d");
    var grad = g.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0.00, "#d7e0e9");
    grad.addColorStop(0.34, "#aab6c1");
    grad.addColorStop(0.50, "#7c8792");
    grad.addColorStop(0.68, "#464e56");
    grad.addColorStop(1.00, "#1a1e22");
    g.fillStyle = grad; g.fillRect(0, 0, 16, 256);

    var tex = new THREE.CanvasTexture(c);
    tex.mapping = THREE.EquirectangularReflectionMapping;
    var pmrem = new THREE.PMREMGenerator(renderer);
    pmrem.compileEquirectangularShader();
    var env = pmrem.fromEquirectangular(tex).texture;
    pmrem.dispose(); tex.dispose();
    return env;
  }

  /* The end caps get their OWN rim vertices rather than sharing the tube's.
     Sharing them let computeVertexNormals average the cap's axial normal into
     the tube's radial one, which drew a bright ring around the middle of the
     gauge where the two halves meet. */
  var NEAR_RIM = RINGS * SEG, FAR_RIM = NEAR_RIM + SEG;
  var CAP_NEAR = FAR_RIM + SEG, CAP_FAR = CAP_NEAR + 1;

  function makeTube() {
    var g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array((CAP_FAR + 1) * 3), 3));
    var idx = [], i, j;
    for (i = 0; i < RINGS - 1; i++) {
      for (j = 0; j < SEG; j++) {
        var a = i * SEG + j, b = i * SEG + (j + 1) % SEG;
        var c = (i + 1) * SEG + j, d = (i + 1) * SEG + (j + 1) % SEG;
        idx.push(a, c, b, b, c, d);
      }
    }
    var tubeCount = idx.length;
    for (j = 0; j < SEG; j++) {
      idx.push(CAP_NEAR, NEAR_RIM + j, NEAR_RIM + (j + 1) % SEG);
      idx.push(CAP_FAR, FAR_RIM + (j + 1) % SEG, FAR_RIM + j);
    }
    g.setIndex(idx);
    // The broken face gets its own material. Shaded like the polished barrel it
    // read as an opening rather than a surface -- a fresh ductile fracture is
    // dull and fibrous, not reflective, and that difference is what makes it
    // legible as torn metal.
    g.addGroup(0, tubeCount, 0);
    g.addGroup(tubeCount, idx.length - tubeCount, 1);
    return g;
  }

  var COS = [], SIN = [];
  for (var _s = 0; _s < SEG; _s++) { COS.push(Math.cos(_s / SEG * Math.PI * 2)); SIN.push(Math.sin(_s / SEG * Math.PI * 2)); }

  /* Uniform thinning until maximum load; past it the neck takes over, about 1.4
     diameters wide -- set by the current diameter, not the gauge length. */
  function profileAt(t, uniform, neck, gaugeHalf, r0, rNeckMin) {
    var rU = r0 / Math.sqrt(1 + Math.max(uniform, 0)), rG = r0 * 1.5, y, r;
    if (t <= 0.80) {
      y = t / 0.80 * gaugeHalf;
      if (neck > 0) {
        var width = Math.max(1.4 * rU, gaugeHalf * 0.10);
        r = rU - (rU - rNeckMin) * neck * Math.exp(-Math.pow(y / width, 2));
      } else r = rU;
    } else if (t <= 0.90) {
      var u = (t - 0.80) / 0.10;
      y = gaugeHalf + u * ENDL * 0.55;
      r = rU + (rG - rU) * (u * u * (3 - 2 * u));
    } else {
      var v = (t - 0.90) / 0.10;
      y = gaugeHalf + ENDL * 0.55 + v * ENDL * 0.45;
      r = rG;
    }
    return { y: y, r: Math.max(r, 0.002) };
  }

  /* Cup and cone: voids coalesce at the neck centre, the flat fibrous crack runs
     outward, the last ligament shears near the surface. Both cap centres shift
     the same way along the axis, so one half's cone seats in the other's cup. */
  function deform(mesh, sign, uniform, neck, gaugeHalf, r0, rNeckMin, capShift) {
    var pos = mesh.geometry.attributes.position, arr = pos.array, i, j, k = 0, first = null, last = null;
    for (i = 0; i < RINGS; i++) {
      var pr = profileAt(i / (RINGS - 1), uniform, neck, gaugeHalf, r0, rNeckMin);
      if (i === 0) first = pr;
      if (i === RINGS - 1) last = pr;
      var x = sign * pr.y;
      if (capShift !== 0 && i === 0) x += capShift * 0.22;   // shear lip at the rim
      for (j = 0; j < SEG; j++) { arr[k++] = x; arr[k++] = pr.r * COS[j]; arr[k++] = pr.r * SIN[j]; }
    }
    // Duplicated rims, positioned with the rings they shadow.
    var nearX = sign * first.y + (capShift !== 0 ? capShift * 0.22 : 0);
    for (j = 0; j < SEG; j++) { arr[k++] = nearX; arr[k++] = first.r * COS[j]; arr[k++] = first.r * SIN[j]; }
    for (j = 0; j < SEG; j++) { arr[k++] = sign * last.y; arr[k++] = last.r * COS[j]; arr[k++] = last.r * SIN[j]; }
    arr[k++] = sign * first.y + capShift; arr[k++] = 0; arr[k++] = 0;
    arr[k++] = sign * last.y; arr[k++] = 0; arr[k++] = 0;
    pos.needsUpdate = true;
    mesh.geometry.computeVertexNormals();
    mesh.geometry.computeBoundingSphere();
  }

  function build(uniform, neck, split, fractured) {
    if (!barA) return;
    var dia = 2 * Math.sqrt(S.area / Math.PI);
    var r0 = Math.min(0.75, Math.max(0.045, (dia / S.gauge) * GH));
    var gh = GH * (1 + uniform);
    var rU = r0 / Math.sqrt(1 + Math.max(uniform, 0));
    var rNeckMin = rU * Math.sqrt(1 - (S.eng ? S.eng.reductionOfArea : 0.44));
    // A ductile fracture face is essentially FLAT -- a fibrous central zone with
    // a small shear lip at the rim. Any real depth here renders as a drilled
    // bore rather than a break, especially on the cup half.
    var capShift = fractured ? -Math.max(rNeckMin * 0.13, 0.004) : 0;
    deform(barA, 1, uniform, neck, gh, r0, rNeckMin, capShift);
    deform(barB, -1, uniform, neck, gh, r0, rNeckMin, capShift);
    barA.position.x = split; barB.position.x = -split;
    var end = gh + ENDL + split;
    gripR.position.x = end + 0.15; gripL.position.x = -end - 0.15;
  }

  function updateCamera() {
    var sp = Math.sin(orbit.pol), cp = Math.cos(orbit.pol);
    camera.position.set(orbit.dist * sp * Math.sin(orbit.az), orbit.dist * cp, orbit.dist * sp * Math.cos(orbit.az));
    camera.lookAt(0, 0, 0);
  }

  function bindOrbit() {
    var dragging = false, lx = 0, ly = 0;
    el.viewport.addEventListener("pointerdown", function (e) {
      dragging = true; lx = e.clientX; ly = e.clientY; el.viewport.setPointerCapture(e.pointerId);
    });
    el.viewport.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      orbit.az -= (e.clientX - lx) * 0.008;
      orbit.pol = Math.max(0.12, Math.min(Math.PI - 0.12, orbit.pol - (e.clientY - ly) * 0.008));
      lx = e.clientX; ly = e.clientY; updateCamera(); render();
    });
    ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
      el.viewport.addEventListener(ev, function () { dragging = false; });
    });
    el.viewport.addEventListener("wheel", function (e) {
      e.preventDefault();
      userZoomed = true;
      orbit.dist = Math.max(2.4, Math.min(11, orbit.dist + Math.sign(e.deltaY) * 0.42));
      updateCamera(); render();
    }, { passive: false });
    el.viewport.addEventListener("keydown", function (e) {
      var k = e.key, step = 0.09, used = true;
      if (k === "ArrowLeft") orbit.az -= step;
      else if (k === "ArrowRight") orbit.az += step;
      else if (k === "ArrowUp") orbit.pol = Math.max(0.12, orbit.pol - step);
      else if (k === "ArrowDown") orbit.pol = Math.min(Math.PI - 0.12, orbit.pol + step);
      else if (k === "+" || k === "=") { userZoomed = true; orbit.dist = Math.max(2.4, orbit.dist - 0.4); }
      else if (k === "-" || k === "_") { userZoomed = true; orbit.dist = Math.min(11, orbit.dist + 0.4); }
      else used = false;
      if (used) { e.preventDefault(); updateCamera(); render(); }
    });
  }

  function resize() {
    var w = el.viewport.clientWidth, h = el.viewport.clientHeight;
    if (!w || !h || !renderer) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    if (!userZoomed) { orbit.dist = fitDistance(); updateCamera(); }
    render();
  }
  function render() { if (renderer) renderer.render(scene, camera); }

  function rest() { build(0, 0, 0, false); el.phase.textContent = "At rest"; render(); }

  /* ================= the test ================= */
  var prog = 1, busy = false;
  function finish() { busy = false; el.run.disabled = false; }

  function run() {
    if (busy || !S.curve) return;
    var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    return S.mode === "load" ? runLoad(reduced) : runPull(reduced);
  }

  function runPull(reduced) {
    var c = S.curve, e = S.eng;
    if (reduced) {
      build(c.epsTotal * 2.2, 1, 0.34, true);
      el.phase.textContent = "Fractured";
      drawCurve(1, null); render(); showResults();
      return;
    }
    busy = true; el.run.disabled = true; hideResults();
    var pts = c.pts, dur = 3000, t0 = null;

    function frame(now) {
      if (t0 === null) t0 = now;
      if (now - t0 > 14000) { snap(); return; }
      var k = Math.max(0, Math.min(1, (now - t0) / dur));
      var p = pts[Math.min(pts.length - 1, Math.floor(k * (pts.length - 1)))];
      var uniform, neck;
      if (p.strain <= c.epsUts) { uniform = p.strain; neck = 0; }
      else {
        uniform = c.epsUts;
        neck = Math.pow((p.strain - c.epsUts) / Math.max(c.epsTotal - c.epsUts, 1e-9), 0.65);
      }
      build(uniform * 2.2, neck, 0, false);
      el.phase.textContent = p.strain <= c.epsYield ? "Elastic"
        : p.strain <= c.epsUts ? "Work hardening" : "Necking";
      drawCurve(k, p); render(); prog = k;
      if (k < 1) requestAnimationFrame(safeFrame); else snap();
    }
    function safeFrame(now) {
      try { frame(now); }
      catch (err) { showResults(); el.phase.textContent = "Fractured"; finish(); throw err; }
    }
    requestAnimationFrame(safeFrame);
  }

  function snap() {
    var t0 = null, dur = 700, c = S.curve;
    el.phase.textContent = "Fractured";
    showResults();
    el.results.classList.add("flash");
    setTimeout(function () { el.results.classList.remove("flash"); }, 520);
    function frame(now) {
      if (t0 === null) t0 = now;
      var k = Math.max(0, Math.min(1, (now - t0) / dur)), ease = 1 - Math.pow(1 - k, 3);
      build(c.epsUts * 2.2 * (1 - 0.012 * ease), 1, 0.34 * ease, true);
      render();
      if (k < 1) requestAnimationFrame(safeFrame); else finish();
    }
    function safeFrame(now) { try { frame(now); } catch (err) { finish(); throw err; } }
    requestAnimationFrame(safeFrame);
  }

  function runLoad(reduced) {
    var o = loadOutcome(), c = S.curve, e = S.eng;
    if (reduced) {
      if (o.broke) { build(c.epsUts * 2.2, 1, 0.34, true); el.phase.textContent = "Fractured"; }
      else { build(o.strain * 2.2, 0, 0, false); el.phase.textContent = "Holding"; }
      drawCurve(1, null); render(); showResults(o);
      return;
    }
    busy = true; el.run.disabled = true; hideResults();
    var peak = o.broke ? e.breakForce : S.target, dur = 2400, t0 = null, pts = c.pts;

    function frame(now) {
      if (t0 === null) t0 = now;
      if (now - t0 > 14000) { settle(o); return; }
      var k = Math.max(0, Math.min(1, (now - t0) / dur));
      var F = peak * k, hit = pts[0], i;
      for (i = 0; i < pts.length; i++) {
        if (pts[i].strain > c.epsUts) break;
        if (pts[i].y <= F) hit = pts[i]; else break;
      }
      build(Math.min(hit.strain, c.epsUts) * 2.2, 0, 0, false);
      el.phase.textContent = F < e.yieldForce ? "Elastic" : "Yielding";
      drawCurve(Math.min(1, hit.strain / c.epsTotal), { x: hit.x, y: F });
      render();
      if (k < 1) requestAnimationFrame(safeFrame);
      else if (o.broke) snap();
      else settle(o);
    }
    function safeFrame(now) {
      try { frame(now); } catch (err) { showResults(o); finish(); throw err; }
    }
    requestAnimationFrame(safeFrame);
  }

  function settle(o) {
    var t0 = null, dur = 700;
    el.phase.textContent = o.yielded ? "Unloading" : "Unloading";
    showResults(o);
    el.results.classList.add("flash");
    setTimeout(function () { el.results.classList.remove("flash"); }, 520);
    function frame(now) {
      if (t0 === null) t0 = now;
      var k = Math.max(0, Math.min(1, (now - t0) / dur)), ease = 1 - Math.pow(1 - k, 3);
      var strainNow = o.strain - (o.strain - o.permanent / S.gauge) * ease;
      build(strainNow * 2.2, 0, 0, false);
      render();
      if (k < 1) requestAnimationFrame(safeFrame);
      else { el.phase.textContent = o.yielded ? "Permanently stretched" : "Unchanged"; finish(); }
    }
    function safeFrame(now) { try { frame(now); } catch (err) { finish(); throw err; } }
    requestAnimationFrame(safeFrame);
  }

  /* ================= wiring ================= */
  function setMode(mode) {
    S.mode = mode;
    el["mode-pull"].setAttribute("aria-pressed", String(mode === "pull"));
    el["mode-load"].setAttribute("aria-pressed", String(mode === "load"));
    el["load-row"].hidden = mode !== "load";
    el.run.textContent = mode === "pull" ? "Pull to failure" : "Apply the load";
    buildTiles(); read(); recompute(); showResults(); rest();
  }
  el["mode-pull"].addEventListener("click", function () { setMode("pull"); });
  el["mode-load"].addEventListener("click", function () { setMode("load"); });

  MODEL.elements.forEach(function (n) {
    el["el-" + n].addEventListener("input", function () {
      S.preset = null; read(); recompute(); showResults(); rest();
    });
  });
  [el.area, el.gauge, el.target].forEach(function (input) {
    input.addEventListener("input", function () { read(); recompute(); showResults(); rest(); });
  });
  el.run.addEventListener("click", run);
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  (mq.addEventListener ? mq.addEventListener.bind(mq, "change") : mq.addListener.bind(mq))(function () { drawCurve(prog, null); });

  // Numbers first: the prediction needs neither three.js nor WebGL.
  buildTiles();
  apply(PRESETS[1]);
  try { initThree(); rest(); }
  catch (err) {
    el.viewport.hidden = true;
    el.phase.textContent = "3D view unavailable";
    if (window.console) console.warn("3D view disabled:", err && err.message);
  }
})();
</script>
