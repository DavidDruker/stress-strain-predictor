[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stresspredict"
version = "0.1.0"
description = "Predicts steel tensile-curve landmarks (yield strength, UTS, elongation) from composition, with leakage-aware evaluation against a measured physical noise floor."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "David Druker" }]
keywords = ["materials-informatics", "steel", "mechanical-properties", "machine-learning"]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.6",
    "pandas>=2.2",
    "joblib>=1.4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["stresspredict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]
markers = [
    "slow: fits models on the real dataset; excluded with -m 'not slow'",
]
